changes = """The repository's file mixes legacy Anchor account flags with a one-byte `discriminator` \
array, which the converter read as Shank without tags; it is marked as Shank and each \
instruction given the Shank `discriminant` its byte states before converting to Codama. \
The program reads, after an instruction's fixed accounts, the first SOL value calculator \
program and its accounts, then the next calculator's or the pricing program's, as many \
