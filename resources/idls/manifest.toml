# Metaplex Token Metadata: the name, symbol, link, creators, royalty,
# collection and rules of nearly every token and NFT on Solana, and the
# program that moves, delegates, locks and burns programmable NFTs. It
# publishes no IDL on chain and is frozen; the file is the Shank IDL in
# mpl-token-metadata at 17e99434, whose source the deployed binary matches,
# with each versioned instruction split by its second byte as Metaplex's own
# clients do.
[[idls]]
file = "mpl-token-metadata.json"
programId = "metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s"
name = "tokenMetadata"
networks = ["mainnet"]
source = { kind = "repository", url = "https://github.com/metaplex-foundation/mpl-token-metadata/blob/17e99434af5ead3e989c08f32af33609821d0bc0/idls/token_metadata.json" }
changes = """Converted from Shank to Codama (the file names its origin as Shank). Removed the \
thirteen instructions the deployed program refuses: the ten it answers as removed (tags \
0, 1, 2, 3, 5, 6, 8, 9, 16 and 48), createMasterEdition (10) and \
mintNewEditionFromMasterEditionViaVaultProxy (13), which it also answers as removed, and \
use (51), which no processor handles. Each unified instruction (burn, create, delegate, \
lock, mint, print, revoke, transfer, unlock, update, verify and unverify) takes one enum \
whose variant is the second byte; as Metaplex's client generator does \
(configs/kinobi.cjs, createSubInstructionsFromEnumArgsVisitor), each variant is its own \
instruction, named as Metaplex's clients name it (transferV1, delegateSaleV1, \
updateAsUpdateAuthorityV2 and so on), told apart by a second one-byte discriminator, \
with the variant's fields as its arguments; the bytes are unchanged. printV2 takes the \
holder delegate record and the delegate the program reads after the listed accounts. As \
in Metaplex's clients, the token account is required in the token-delegate approvals and \
revocations and in the two programmable-config delegate updates, the collection mint in \
verifyCollectionV1 and unverifyCollectionV1, and printV1's master holder signs. \
utilize's accounts from the optional rent sysvar on, and the accounts collect reads \
after the recipient, are remaining-accounts groups. The Token program's mint account is \
added, so the amounts of transfers, mints, burns, token delegations and escrow transfers \
read the decimals of the mint they name. Display nodes added by hand."""

# GMX Solana (GMTrade): the store program of the perpetual and spot exchange
# GMX runs on Solana. Most of what people sign are requests (orders, deposits,
# withdrawals, shifts, GLV deposits and withdrawals) that keepers execute
# later. Its Anchor IDL (gmsol_store 0.11.0) is converted after renaming
# generic type parameters, which the converter otherwise cannot handle.
[[idls]]
file = "gmx-solana.json"
programId = "Gmso1uvJnLbawvw7yezdfCDcPydwW2s2iqG3w6MDucLo"
name = "gmsolStore"
networks = ["mainnet"]
source = { kind = "chain", network = "mainnet", account = "anchor", sha256 = "c66669a674e15d3b080170ebd1b2e3c7b04ded1faaf561a50e88a6ab765f3604" }
changes = """Converted from Anchor to Codama after renaming the generic parameters of 25 types (to \
<Type>__<name>): the converter does not yet handle a generic type that passes its own \
parameter on under the same name; generic types are monomorphized, so no layout and no \
name a person sees changes. Instructions with optional accounts set \
optionalAccountStrategy to programId. Requests to place an order, deposit, withdraw or \
deposit into and withdraw from a GLV declare the markets of their swap paths as a \
remaining-accounts group; keeper executions, liquidations, auto-deleveraging, market \
state updates and the token value queries declare their price feeds and the other \
accounts they read as one group; setPricesFromPriceFeed declares its price feeds, \
initializeGlv its market tokens and migrateReferralCode its referral code accounts. The \
Token program's mint account is added, so market token, GLV token and withdrawal output \
amounts, and the amount of a claimable account, read their mint's decimals; deposit and \
order collateral amounts, GT amounts and market transfers are in base units; position \
sizes and USD values have 20 decimals, the program's fixed point; builder fees, \
discounts and deviation factors are in percent; trigger and acceptable prices are left \
raw with their scale in the label. Display nodes added by hand."""

# Chainlink CCIP lock-release token pool (lockrelease_token_pool), which holds
