[[idls]]
file = "raydium-router.json"
programId = "DRaybByLpbUL57LJARs3j8BitTxVfzBg351EaMr5UTCd"
name = "raydiumRouter"
networks = ["devnet"]
source = { kind = "hand" }
changes = """Data layouts and account orders taken from transactions the program \
executed. The route's hops are one remaining-accounts group, since their accounts \
depend on each pool program."""

[[idls]]
file = "orca-whirlpool.json"
programId = "whirLbMiicVdio4qvUfM5KAg6Ct8VwpYzGff3uctyCc"
name = "whirlpool"
# Devnet runs the same version, but its IDL accounts are missing or years old.
networks = ["mainnet", "devnet"]
source = { kind = "chain", network = "mainnet", account = "programMetadata", sha256 = "9c4ad85a942e27f571c4f33453b0b0f2fef1dde5e9c201b301668068e67ace0d" }
changes = """Converted from Anchor to Codama. The V2 instructions declare the transfer \
hook and supplemental tick array accounts they read. Display nodes added by hand."""

# The three memo programs take the same data: the memo as UTF-8, and any
# signers after it. The repository's IDL is v4's; the v3 and v1 files are it
# with their program address and version.
[[idls]]
file = "memo.json"
programId = "Memo4c2pN8afCj432Lb7RMVKi9PbQnnW7ewFFaV3oAH"
name = "memo"
networks = ["mainnet", "devnet", "testnet"]
source = { kind = "repository", url = "https://github.com/solana-program/memo/blob/be804bfab190e3955bffb2a18864ad61676345c6/idl.json" }
changes = "Unchanged."

[[idls]]
file = "memo-v3.json"
programId = "MemoSq4gqABAXKb96qnH8TysNcWxMyWCqXgDLGmfcHr"
name = "memo"
networks = ["mainnet", "devnet", "testnet"]
source = { kind = "repository", url = "https://github.com/solana-program/memo/blob/be804bfab190e3955bffb2a18864ad61676345c6/idl.json" }
changes = "The v4 IDL with v3's program address and version."

[[idls]]
file = "memo-v1.json"
programId = "Memo1UhkJRfHyvLMcVucJwxXeuD728EqVDDwQDxFMNo"
name = "memo"
networks = ["mainnet", "devnet", "testnet"]
source = { kind = "repository", url = "https://github.com/solana-program/memo/blob/be804bfab190e3955bffb2a18864ad61676345c6/idl.json" }
changes = """The v4 IDL with v1's program address and version. v1 does not check \
the signers it is passed: they sign the transaction, not the memo."""

[[idls]]
file = "realms-governance.json"
programId = "GovER5Lthms3bLBqWub97yVrMmEogzX7xNjdXpPPCVZw"
name = "splGovernance"
# The program publishes no IDL on chain. The file is the Shank IDL of Mythic's
# governance SDK, checked against spl-governance v3.1.3, which the binaries
# running on both networks match up to instruction 28.
networks = ["mainnet", "devnet"]
source = { kind = "repository", url = "https://github.com/Mythic-Project/governance-sdk/blob/dd3997ae0a32d95cd1207bab3af82b32594ee88e/src/idl/gov.json" }
changes = """Converted from Shank to Codama. Dropped the instructions the program does \
not run as the source describes: the deprecated legacy1, createProgramGovernance, \
createMintGovernance and createTokenGovernance, which it rejects, and \
addRequiredSignatory and removeRequiredSignatory, whose tags 29 and 30 are its \
transaction buffer instructions. Optional accounts are omitted rather than replaced by \
the program id. The accounts whose presence depends on the arguments or the realm's \
plugins (createRealm and setRealmConfig after the realm authority, createProposal's \
voter weight record and deposit, castVote's voter weight records) and the accounts \
executeTransaction passes on are remaining-accounts groups, so names do not land on the \
wrong accounts. createProposal's deposit account is writable. Token amounts are in base \
units. Display nodes added by hand."""
