source = { kind = "chain", network = "devnet", account = "programMetadata", sha256 = "9fa6136d536592d90ebfea5fd16f1db8d33056d9a5a9f153f6e8468400ae781f" }
changes = """Converted from Anchor to Codama. `updateAmmConfig` declares the new owner \
