Token program's mint account is added, so the collateral of a request or limit order \
reads its input mint's decimals and JLP amounts the JLP mint's; position sizes, \
collateral decreases, price limits and trigger prices are in USD with 6 decimals; other \
token amounts are in base units; fees are in percent. Display nodes added by hand."""

