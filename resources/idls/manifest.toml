changes = """Converted from Shank to Codama (the file names its origin and address). Each instruction \
takes one enum whose variant is the second byte; as Metaplex's client generator does \
(configs/kinobi.cjs, CreateSubInstructionsFromEnumArgsVisitor), each variant is its own \
instruction, named as Metaplex's clients name it (createOrUpdateV1, validateV1, \
writeToBufferV1, puffRuleSetV1), told apart by a second one-byte discriminator, with the \
variant's fields as its arguments; the bytes are unchanged. The accounts validate reads \
after the listed six, the accounts the rules check, are a remaining-accounts group. \
optionalAccountStrategy is programId, as the converter sets it. Display nodes added by \
hand."""

# Metaplex Core, the single-account NFT standard: assets, collections, groups
# and the plugins that grant control over them. It publishes no IDL on chain;
# the file is the Shank IDL its clients are generated from, in Metaplex's
# repository at the commit the upgrade authority's OtterSec record names,
# checked tag by tag against the program source and the deployed binary.
# Devnet runs the same executable.
[[idls]]
file = "mpl-core.json"
programId = "CoREENxT6tW1HoK8ypY1SxRMZTcVPm7R94rH4PZNhX7d"
name = "mplCoreProgram"
networks = ["mainnet", "devnet"]
source = { kind = "repository", url = "https://github.com/metaplex-foundation/mpl-core/blob/8c5cee35199a7d103e181de7b13f2e20b1e20103/idls/mpl_core.json" }
changes = """Converted from Shank to Codama (the file names its origin). Checked against the program \
source at 8c5cee35 (instruction.rs, the processors and every type): \
CreateGroupV1Args.relationships, which Shank wrote as a vector of `crate`, now links to \
RelationshipEntry. Optional accounts are read as absent when they hold the program's own \
address. The program passes the whole account list to its plugin checks, so the \
instructions that run them end with one shown remaining-accounts group (accounts an \
oracle, a lifecycle hook or the Agent Identity registry reads); Execute's remaining \
accounts are those of the instruction the asset signs, Collect's the assets it collects \
from, and the group instructions' the collections, assets or groups they act on, each a \
shown group. Display nodes added by hand."""

# Metaplex Bubblegum, the program for compressed NFTs: leaves of a merkle tree
# minted, transferred, delegated and burned with a proof. Its Anchor IDL
# account still holds version 0.12.0, without the V2 instructions the deployed
# program has (transfers, mints and burns of NFTs in Core collections), so the
# file is the IDL in Metaplex's repository, which names every instruction the
# binary logs. Devnet runs the same executable.
[[idls]]
file = "mpl-bubblegum.json"
programId = "BGUMAp9Gq7iTEuizy4pqaxsTyUCBK68MDfK752saRPUY"
name = "bubblegum"
networks = ["mainnet", "devnet"]
source = { kind = "repository", url = "https://github.com/metaplex-foundation/mpl-bubblegum/blob/79e1a1954bddb7fe5dcd52a5570a66a9f7d465e4/idls/bubblegum.json" }
changes = """Converted from Anchor to Codama. Every instruction that replaces a leaf declares the \
merkle proof it carries after its listed accounts as a hidden remaining-accounts group \
(the nodes from the leaf up to the canopy); the mints declare the extra signers they \
count as verified creators as a shown group. Optional accounts are read as absent when \
they hold the program's own address. Royalties read as a percent. The merkle roots and \
the hashes that identify a leaf, `[u8; 32]` arrays in the source, are typed as 32-byte \
fixed-size bytes so they read as hex; the bytes are the same. Display nodes added by \
hand."""

# Market Tick, a sub-slot clock: a signer writes its own nanosecond timestamp
# for the current slot into one shared account many times a slot, and the
# first signer of a slot keeps it for that slot. The program does not check
# who signs or that the time is true. Its source is public in the
# firedancer-io organisation on GitHub; the IDL in its program-metadata
# account is that repository's idls/market_tick.json, byte for byte, and
# devnet holds the same build and document.
[[idls]]
file = "market-tick.json"
programId = "tickUcsEQegChaAuo9VYQQztB4ZGApY6ZT4FkULWY6N"
name = "marketTick"
networks = ["mainnet", "devnet"]
source = { kind = "chain", network = "mainnet", account = "programMetadata", sha256 = "80124ebab574b5fa11ae3e27b90589a660a00ef0a10dd53f9cd7abde8173d988" }
changes = """Converted from Anchor to Codama. The signer's timestamp reads as a date from nanoseconds \
and the target interval in milliseconds. Display nodes added by hand."""

# Sanctum Router (formerly stakedex): moves SOL and liquid staking tokens
# through stake pools and stake accounts, for wrapped SOL staked into an LST,
# an LST redeemed for wrapped SOL or withdrawn as a stake account, a stake
# account deposited for an LST, and one LST swapped for another by way of a
# stake account. It publishes no IDL on chain. The file is the Shank IDL in
# Sanctum's stakedex-sdk repository; its successor sanctum-router-sdk has no
# IDL but builds the same nine tags with the same accounts and data.
[[idls]]
file = "sanctum-router.json"
programId = "stkitrT1Uoy18Dk1fTrgPw8W6MVzoCfYoAFT4MLsmhq"
name = "stakedex"
networks = ["mainnet"]
source = { kind = "repository", url = "https://github.com/igneous-labs/stakedex-sdk/blob/87685585cb246e7e0d75e9d59606707d8a20d336/interfaces/stakedex_interface/idl.json" }
changes = """Converted from Shank to Codama; every instruction keeps its one-byte tag. The accounts \
of the stake pool (or Lido, Marinade or the Sanctum reserve) a route goes through follow \
the router's fixed accounts and vary by pool, so they are declared as one \
remaining-accounts group, shown as Stake Pool Accounts. The Token program's mint account \
is added, so input amounts read in the input mint's decimals; wrapped SOL amounts read \
in SOL's 9 decimals. Display nodes added by hand."""

# Upshift's vaults, run by August Digital (august_vault): people deposit one
# token into a vault for its share token and redeem shares for their part of
# the vault's tokens, paid at once less a withdrawal fee; the vault's operator
# moves funds out to strategies and back and reports what is deployed. The
# file is the Anchor IDL its IDL account publishes on mainnet, which is older
# than the program deployed, with deposit_checked and redeem_checked added
# from the OtterSec-verified source.
[[idls]]
file = "upshift.json"
programId = "up12bytoZBmwofqsySf2uqKQ7zpfeKiAWwfvqzJjtRt"
name = "augustVault"
networks = ["mainnet"]
source = { kind = "chain", network = "mainnet", account = "anchor", sha256 = "ca4dd18089a73219cacdb6e47e2b2e2a0439001a9afb18adf4db240380f09c52" }
changes = """Converted from Anchor to Codama. `initialize` is removed: the deployed program takes \
other accounts, in another order, and two more arguments, so it reads raw rather than \
with wrong names. `operatorWithdraw` and `operatorDeposit` declare the registered \
destination's entry the deployed program reads after their listed accounts. The Token \
program's mint account is added, so amounts read the decimals of the deposit and share \
mints the instructions name. `depositChecked` and `redeemChecked`, which the deployed \
program has and the chain's IDL lacks, are added from the verified source (commit \
87c0f2d4): each takes the accounts of `deposit` or `redeem` in the same order and one \
more u64, the least shares or the least payout after the fee. Display nodes added by \
hand."""

# Quarry's liquidity-mining program (quarry_mine 5.0.2), which Saber, Sunny
# and others built rewards on: a rewarder pays a token, minted through
# Quarry's mint wrapper, to the quarries it shares its rate among, and people
# stake a quarry's token through their miner to earn it. The file is the
# legacy Anchor IDL its IDL account publishes on mainnet, which carries no
# program address; devnet runs another build with another IDL.
[[idls]]
file = "quarry-mine.json"
programId = "QMNeHCGYnLVDn1icRAfQZpjPLBNkfGbSKRB83G5d8KB"
name = "quarryMine"
networks = ["mainnet"]
source = { kind = "chain", network = "mainnet", account = "anchor", sha256 = "7eda2e145e31caa8e4e5223f40da180bc0f8bdb13a0cec0c09a3976b7b027371" }
changes = """Converted from legacy Anchor to Codama, with the program's address set (a legacy IDL has \
none). The nested account groups are flattened without prefixes; no instruction has two \
accounts of one name. Display nodes added by hand."""

# Perena's vault program (bankineco): people deposit USDC into a vault for its
# share token (USD*, priced by the vault's net asset value) or into its senior
# (USD*P) or junior (USD*J) tranche, redeem shares now, or queue a junior
# withdrawal paid out after a lockup; Perena's curator, managers and oracle
# signers run the vault. The file is the Anchor IDL its IDL account publishes
# on mainnet, which is older than the program deployed: the 48 instructions
# the deployed program no longer has or has changed are removed, and the
# instructions added since read raw.
[[idls]]
file = "perena.json"
programId = "save8RQVPMWNTzU18t3GBvBkN9hT7jsGjiCQ28FpD9H"
name = "bankineco"
networks = ["mainnet"]
source = { kind = "chain", network = "mainnet", account = "anchor", sha256 = "ea91e453f61c5c5f1a94373392378a8b346db29a100957d4461760cd3716aa15" }
changes = """Converted from Anchor to Codama. Removed the 40 instructions the deployed program no \
longer has (the legacy bank, gen-vault and junior-staking instructions) and 8 whose \
accounts or argument types it has changed (`crankPerformanceFees`, `createVault`, \
`fulfillJuniorTrancheWithdraw` and its fee-exempt variant, `managerWithdrawAsset`, \
`setVaultConfig`, `vaultCreateTrancheState`, `vaultUpdateTrancheConfig`), so they read \
raw rather than wrong. Withdrawals from external liquidity, Jupiter swaps and protocol \
interactions declare the accounts of the external program they call, read after their \
listed accounts. Instructions with optional accounts take the program's address for an \
absent one. The Token program's mint account is added, so deposit, withdrawal and \
tranche amounts read the decimals of the asset and share mints the instructions name. \
Display nodes added by hand."""

# Velocity, the perpetuals and spot exchange formerly called Drift: a fork of
# Drift protocol v2 deployed in July 2026 at a new address (the address Drift
# ran at, dRiftyHA…, no longer runs the exchange). The IDL is the one its
# upgrade authority wrote to the program-metadata account; 14 PDA seeds in it
# name an argument by the wrong name and are corrected before conversion.
[[idls]]
file = "velocity.json"
programId = "vELoC1audYbSYVRXn1vPaV8Axoa9oU6BYmNGZZBDZ1P"
name = "velocity"
networks = ["mainnet"]
source = { kind = "chain", network = "mainnet", account = "programMetadata", sha256 = "1a746c36f818be772c8adfccc2393e197ab879c23093dcfab929c564608a62b2" }
changes = """Fourteen PDA seeds name an instruction argument by the name the Rust accounts struct \
gives it in #[instruction(...)] rather than the handler's name for the same first \
argument (spotMarketIndex for quoteSpotMarketIndex or marketIndex, marketIndex for \
spotMarketIndex, subAccountId for _subAccountId); prep.py renames those seed paths so \
the converter accepts the file. Converted from Anchor to Codama. Instructions whose \
handlers read accounts after their named ones (oracles, spot markets and perp markets, \
then for some the token mint and transfer-hook accounts, maker subaccounts, the referrer \
or revenue-share escrows) declare them as one labelled remaining-accounts group. Display \
nodes added by hand."""
