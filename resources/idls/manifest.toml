changes = """Converted from Anchor to Codama. The chain's IDL links to eight types it does not define \
(the lock and release arguments, the remote chain settings, remote addresses, the rate \
limit settings and the pool's state), because they come from the base_token_pool crate; \
they are added unchanged from Codama's conversion of base_token_pool.json in \
smartcontractkit/chainlink-ccip at 9546a59b, the commit OtterSec verified for this \
program, so the lock, the release and the remote chain and rate limit instructions \
decode. The Token program's mint account is added, so the amount locked and the \
liquidity provided or withdrawn read in the token's units; the rate limits stay in base \
units, since the mint is not one of their accounts, and the amount a release carries is \
a 32-byte number in the source chain's decimals, shown as its bytes. Display nodes added \
by hand."""

# LayerZero V2 endpoint (endpoint 0.1.0), the program every LayerZero
# application on Solana, such as an OFT token bridge, sends and receives
# cross-chain messages through. The file is the legacy Anchor IDL its Anchor
# IDL account publishes on mainnet, which carries no program address. Devnet
# runs another build and publishes a slightly different document, so the file
# is mainnet only.
[[idls]]
