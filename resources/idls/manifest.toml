source = { kind = "repository", url = "https://github.com/pump-fun/pump-public-docs/blob/639b87fb45c3adeffa6f7c4a1bf0cb85e392bf22/idl/pump_amm.json" }
changes = """Converted from Anchor to Codama. buy, buyExactQuoteIn and sell declare the accounts they \
read after the named ones (a cashback coin's accounts, the pool-v2 account, a buyback \
