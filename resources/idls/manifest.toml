# account publishes on mainnet (1.6.2), which leaves out the eight types it
# shares with Chainlink's other pools; they are added from the base_token_pool
# IDL in Chainlink's repository at the verified commit. Devnet runs a newer
# build (2.0.0) at the same address, so the file is mainnet only.
[[idls]]
file = "ccip-lockrelease-pool.json"
