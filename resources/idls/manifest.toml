endRebalance declare the same group for their calculator's accounts. The INF mint is \
writable in addLiquidity and removeLiquidity, as the program mints and burns through it. \
The Token program's mint account is added, so token amounts read their mint's decimals; \
the protocol fee is shown in percent. Display nodes added by hand."""

