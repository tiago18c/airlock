# where the output goes; the input, the mints and the venues' accounts are in
# its route. Devnet runs another executable and publishes no IDL.
[[idls]]
file = "dflow.json"
programId = "DF1ow4tspfHX9JwWJsAb9epbkA8hmpSEAtxXy1V27QBH"
name = "swapOrchestrator"
networks = ["mainnet"]
source = { kind = "chain", network = "mainnet", account = "anchor", sha256 = "f4a6f4564bdfd670c4265144c5a628f8a73578a3b2c0d2a04b94166a0cccd19c" }
changes = """Converted from Anchor to Codama. The swaps and fillOrder declare the accounts their \
