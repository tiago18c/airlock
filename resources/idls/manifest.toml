[[idls]]
file = "raydium-cp-swap-mainnet.json"
programId = "CPMMoo8L3F4NbTegBCKVNunggL7H1ZpdTHKxQB5qKP1C"
name = "raydiumCpSwap"
networks = ["mainnet"]
# The devnet file with mainnet's program, admin and fee receiver addresses:
# they are all the two networks' published IDLs differ in.
source = { kind = "chain", network = "mainnet", account = "programMetadata", sha256 = "d86fe11ffc719fee9832f78a1c7374452ee9ebe2c63d51c0b5e5cb383a8fcfdb" }
changes = """Converted from Anchor to Codama. `updateAmmConfig` declares the new owner \
it reads as a remaining account. Token amounts are in base units. Display nodes added \
