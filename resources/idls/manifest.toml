changes = """Converted from Anchor to Codama. Loan, ledger and liquidity-position instructions \
declare the accounts they read after their listed accounts, which Anchor IDLs cannot: \
the strategy and market of each of the loan's ledgers and the oracle accounts of its \
health check (named from the IDL's own docs on DepositCollateralParams and \
WithdrawCollateralParams and from executed transactions), the reward token accounts of a \
rewards claim, and, on a liquidation and on proposing or applying a timelocked vault \
change, accounts the file does not name one by one (labelled Additional Account). \
sellLedger takes absent optional accounts as the program's address. The Token program's \
mint account is added, so principal, collateral, share, fee and reward amounts read \
their mint's decimals where that mint is an account of the instruction; amounts inside \
vault deposit and withdrawal modes, timelocked changes and market caps stay in base \
units. Rates, fees, LTVs and liquidation thresholds in Loopscale's cbps (1,000,000 = \
100%) read as percent where they are single numbers. Display nodes added by hand."""

