# The IDLs of third-party programs that ship with the app, packed at build
# time into `idls.pack` (crates/app-ui-kit/build.rs). The build pins the
# pack's SHA-256, and the app refuses a pack that does not match. Every JSON
# file in this folder must be listed here.
#
# Each [[idls]] entry:
#   file        a file in this folder
#   programId   the address the file declares
#   name        `program.name` in the file
#   networks    where the program runs at programId with this interface:
#               "mainnet", "devnet", "testnet", "localnet"
#   source      what the file was made from:
#               { kind = "chain", network, account = "programMetadata" | "anchor", sha256 }
#                 sha256 of the bytes that account held, so a check that finds
#                 them on chain says the file matches its source
#               { kind = "repository", url }
#               { kind = "hand" }
#   changes     what was changed after taking it from its source
#
# A program at different addresses on two networks has a file for each.

[[idls]]
file = "raydium-clmm.json"
programId = "DRayAUgENGQBKVaX8owNhgzkEDyoHTGVEGHVJT1E9pfH"
name = "raydiumClmm"
networks = ["devnet"]
source = { kind = "chain", network = "devnet", account = "programMetadata", sha256 = "216dbb0ddadfa73e71a8b1819a04543542bd24e2f4c1ceeae0d779c85bfb8403" }
changes = """Converted from Anchor to Codama. The swap and liquidity instructions \
declare the remaining accounts they read (tick arrays, the bitmap extension, a swap \
route), which Anchor IDLs cannot. Token amounts are in base units: the IDL cannot read \
a mint's decimals. Display nodes added by hand."""

