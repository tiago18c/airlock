# PumpSwap, pump.fun's constant-product AMM. The file is the IDL in pump.fun's
# public docs repository, not the one the program publishes: its Anchor IDL
# account (the same on mainnet and devnet) predates 12 instructions both
# deployed builds run, the v2 trades and the multi-hop swap among them. The
# repository's lists exactly the instructions both builds have.
[[idls]]
file = "pump-amm.json"
programId = "pAMMBay6oceH9fJKBRHGP5D4bD4sWpmSwMn52FMfXEA"
name = "pumpAmm"
