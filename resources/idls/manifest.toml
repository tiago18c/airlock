# Loopscale (loopscale), an order-book lending protocol: borrowers take
# fixed-rate, fixed-term loans from lenders' strategies against collateral,
# and Loopscale Vaults lend their depositors' tokens through a strategy. The
# file is the Anchor IDL its Anchor IDL account publishes on mainnet; it has
# no program-metadata account and no devnet deployment. Loopscale co-signs
# user transactions with its protocol admin key.
[[idls]]
file = "loopscale.json"
programId = "1oopBoJG58DgkUVKkEzKgyG9dvRmpgeEm1AVjoHkF78"
name = "loopscale"
