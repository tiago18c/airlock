changes = """Converted from Shank to Codama (the file names its origin, so each instruction keeps its \
one-byte tag). Checked against vault_sdk and vault_program at the same commit: every \
tag, account order and argument matches, so no instruction is changed. \
optionalAccountStrategy is programId on mintTo, enqueueWithdrawal and \
burnWithdrawalTicket, whose last account, the vault's mint-burn admin, clients either \
leave out or pass as the program's address, and removed from the instructions without an \
optional account. The Token program's mint account is added so a deposit's minimum \
receipt tokens and a new vault's first deposit read in the token's own units. Display \
nodes added by hand."""

# Jito's restaking program: it registers operators and node consensus networks
# (NCNs) and records how they and Jito vaults opt in to one another. It
# publishes no IDL on chain; the file is the Shank IDL in
