# Sanctum Infinity's controller, the multi-LST pool behind the INF token:
# swaps between liquid staking tokens, and INF minted for an LST deposited or
# burned for one withdrawn, priced by SOL value calculator programs and a
# pricing program it calls. It publishes no IDL on chain. The file is the IDL
# in Sanctum's inf-1.5 repository, where the deployed controller is developed;
# the IDL in the archived S repository describes an older build.
[[idls]]
file = "sanctum-infinity.json"
programId = "5ocnV1qiCgaQR8Jb8xWnVbApfaygJ8tNoZfgPwsgx9kx"
name = "infController"
