programId = "KLend2g3cP87fffoy8q1mQqGKjrxjC8boSyAYavgmjD"
name = "kaminoLending"
networks = ["mainnet"]
source = { kind = "chain", network = "mainnet", account = "anchor", sha256 = "838837c76e4454563f206461411259c6573daddb1e269dee8cc94347ccfdc367" }
changes = """Converted from Anchor to Codama. The program's address is set, which a legacy Anchor IDL \
does not carry. In repayAndWithdrawAndRedeem, depositAndWithdraw, \
liquidateObligationAndRedeemReserveCollateralV2 and rolloverFixedTermBorrow, whose \
account groups repeat names (two owners, two obligations, two farm accounts), every \
grouped account takes its group's name as a prefix (withdrawAccountsOwner), as the v01 \
and TypeScript converters do and the legacy converter does not; nothing else is renamed. \
Instructions that read accounts after their named ones declare them as remaining \
accounts, which Anchor IDLs cannot: the obligation's reserves (and its referrer token \
states) for refreshObligation, requestElevationGroup and the borrow, repay, liquidation \
and loss instructions, the reserves a batch refresh lists, and the permissioning \
authority a permissioned market requires as the last signer of a deposit, borrow or \
liquidation. The Token program's mint account is added, so liquidity and collateral \
token amounts read their mint's decimals where the mint is an account of the \
instruction; collateral amounts of depositObligationCollateral and \
withdrawObligationCollateral, and socialized losses, are in base units. Fees, rates and \
execution bonuses are in percent, terms are durations. Display nodes added by hand."""

# OKX's DEX router, the swap aggregator OKX Wallet and OKX DEX have their
# users sign: swaps along a route of venues with an integrator's commission, a
# platform fee and a trim of output above the quote, plus helpers that create
# token accounts. The Anchor IDL names the program "OKX: DEX Router", which
# the conversion turns into okxDexRouter. Devnet runs another executable and
# publishes no IDL.
[[idls]]
file = "okx-dex-router.json"
programId = "proVF4pMXVaYqmy4NjniPh4pqKNfMmsihgd4wdkCX3u"
name = "okxDexRouter"
networks = ["mainnet"]
source = { kind = "chain", network = "mainnet", account = "anchor", sha256 = "2984309d31f11ed1ce0c3cb563c824ab196c9e68cb3a3ab540fd12b1bd94ec13" }
changes = """Converted from Anchor to Codama. The swaps declare the accounts their route reads, with \
any trim and charge accounts after them, as one remaining-accounts group. Instructions \
with optional accounts set optionalAccountStrategy to programId. The Token program's \
mint account is added, so a swap's amount in and quoted output read the decimals of the \
input and output mints the instruction names. Slippage and the platform's share of the \
commission are in percent; the packed commission and the trim and charge rates are plain \
numbers. Display nodes added by hand."""

# Raydium LaunchLab (raydium_launchpad), the bonding-curve launchpad behind
# letsbonk.fun and other platforms: buys and sells on a token's curve, token
# and pool creation, creator, platform and vesting claims, and the migration
# to a Raydium pool. Its program-metadata and Anchor IDL accounts hold the
# same document. Devnet runs it at another address
# (DRay6fNdQ5J82H7xV6uq2aV3mNrUZ1J4PgSKsWgptcm6).
[[idls]]
file = "raydium-launchlab.json"
programId = "LanMV9sAd7wArD4vJFi2qDdfnVhFxYSUg6eADduJ3uj"
name = "raydiumLaunchpad"
networks = ["mainnet"]
source = { kind = "chain", network = "mainnet", account = "programMetadata", sha256 = "94f2405a89d172ef6cf632682076455dba927f9c103ed32178d0b237c643b3bb" }
changes = """Converted from Anchor to Codama. The four trades declare the accounts they read after \
the named ones (the share fee recipient when there is a share fee, the System program, \
the platform fee vault and the creator fee vault) as one remaining-accounts group, shown \
as Fee Accounts. initializeV2 and initializeWithToken2022 declare the platform's allow \
record and launch rule, each passed only when the platform has one, as one hidden \
remaining-accounts group; updatePlatformConfig declares the CP swap AMM config its \
CpSwapConfig and AllInfo changes read; migrateToCpswap declares the accounts it reads \
after the named ones as one hidden group. The Token program's mint account is added, so \
the trades' amounts read their base or quote mint's decimals. Rates are per million, as \
the program counts them; vesting shares and a new pool's curve settings are in base \
units. Display nodes added by hand."""

