name: Linux bundles

# The .deb and the AppImage of the desktop apps, for the release. Before
# uploading them it installs the .deb, starts both formats and registers the
# browser bridge from each, so a broken package fails the build instead of
# reaching a release. Pull requests do not run it: CI builds and tests only.
# See docs/releasing.md.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      packages:
        type: string
        default: '["airlock", "airlock-offline"]'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Must match the dioxus version in Cargo.lock, and release.yml's.
  DX_VERSION: 0.7.10

jobs:
  bundle:
    name: ${{ matrix.package }}
    # The oldest supported Ubuntu: the AppImage runs on a glibc at least this new.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        package: ${{ fromJSON(inputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libudev-dev libssl-dev libfuse2 xvfb
      # The prebuilt dx needs a newer glibc than 22.04 has, so it is built
      # here, once per version.
      - id: dx-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/dx
          key: dx-${{ env.DX_VERSION }}-ubuntu-22.04
      - name: Build the Dioxus CLI
        if: steps.dx-cache.outputs.cache-hit != 'true'
        run: cargo install --locked dioxus-cli@${{ env.DX_VERSION }}
      - name: Bundle
        run: scripts/bundle-linux.sh "${{ matrix.package }}" "${{ inputs.version }}" out
      - name: Install the .deb and start it
        run: |
          sudo apt-get install -y ./out/*.deb
          export AIRLOCK_DATA_DIR="$(mktemp -d)"
          xvfb-run -a timeout 20 "/usr/bin/${{ matrix.package }}" || [ $? -eq 124 ]
      - name: Start the AppImage
        run: |
          export AIRLOCK_DATA_DIR="$(mktemp -d)"
          xvfb-run -a timeout 20 ./out/*.AppImage || [ $? -eq 124 ]
      - name: Register the bridge from the .deb
        if: matrix.package == 'airlock'
        run: |
          /usr/bin/bridge-host install
          grep -q '"path": "/usr/bin/bridge-host"' ~/.config/google-chrome/NativeMessagingHosts/dev.airlock.bridge.json
          /usr/bin/bridge-host uninstall
      - name: The AppImage has the bridge
        if: matrix.package == 'airlock'
        run: |
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE"/out/*.AppImage --appimage-extract > /dev/null
          test -x squashfs-root/usr/bin/bridge-host
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.package }}
          path: out/
          if-no-files-found: error
