name: Release

# Pushing a tag like v0.2.0 builds the release and opens it as a draft.
# A person reads the draft, checks the files, and publishes it. See docs/releasing.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  verify:
    name: Version and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Versions agree and the changelog has this release
        run: node scripts/release-check.mjs "${{ steps.version.outputs.version }}" notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md

  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  build:
    name: Build
    needs: [verify, checks]
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.verify.outputs.version }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  publish:
    name: Draft release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Checksums
        run: |
          mkdir release
          cp artifacts/desktop/* artifacts/airgap/* artifacts/macos/* artifacts/linux-*/* artifacts/android/* artifacts/extension/* release/
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # Signed statement that these exact files were built by this workflow
      # from this commit. Verify with `gh attestation verify <file> --repo <repo>`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: release/*
      # The same attestation as a Sigstore bundle beside the files, so it can be
      # checked with cosign, without GitHub's CLI or an account.
      - name: Sigstore bundle
        run: cp "${{ steps.attest.outputs.bundle-path }}" "release/airlock-${{ needs.verify.outputs.version }}.sigstore.json"
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Airlock $VERSION" \
            --notes-file artifacts/notes/notes.md \
            --draft $prerelease
