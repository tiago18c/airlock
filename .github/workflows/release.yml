name: Release

# Pushing a tag like v0.2.0 builds the release and opens it as a draft.
# A person reads the draft, checks the files, and publishes it. See docs/releasing.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Must match the dioxus version in Cargo.lock.
  DX_VERSION: 0.7.10

jobs:
  verify:
    name: Version and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Versions agree and the changelog has this release
        run: node scripts/release-check.mjs "${{ steps.version.outputs.version }}" notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md

  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  desktop:
    name: Windows app and native host
    needs: [verify, checks]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f # v1.26.2
      - name: Install the Dioxus CLI
        run: cargo binstall -y dioxus-cli@${{ env.DX_VERSION }}
      # The full installer, the small one and the portable zip.
      - name: Bundle the app
        shell: bash
        run: scripts/bundle-windows.sh airlock "${{ needs.verify.outputs.version }}" DownloadBootstrapper out
      - name: Build the native messaging host
        run: cargo build --locked --release -p bridge-host
      - name: Collect files
        shell: bash
        run: cp target/release/bridge-host.exe "out/bridge-host-${{ needs.verify.outputs.version }}-windows-x64.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop
          path: out/
          if-no-files-found: error

  airgap:
    name: Windows airgap app
    needs: [verify, checks]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f # v1.26.2
      - name: Install the Dioxus CLI
        run: cargo binstall -y dioxus-cli@${{ env.DX_VERSION }}
      # Its machine may never be online, so the small installer cannot fetch
      # WebView2: it assumes Windows has it, as Windows 11 does.
      - name: Bundle the airgap app
        shell: bash
        run: scripts/bundle-windows.sh airlock-offline "${{ needs.verify.outputs.version }}" Skip out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: airgap
          path: out/
          if-no-files-found: error

  android:
    name: Android app
    needs: [verify, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show && rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f # v1.26.2
      - name: Install the Dioxus CLI
        run: cargo binstall -y dioxus-cli@${{ env.DX_VERSION }}
      # dx builds a release APK with Gradle's assembleRelease, signed and
      # without the debuggable flag, only when Dioxus.toml has [bundle.android].
      # Without it, it assembles a debug APK. The keystore and its passwords
      # are written for this run only and never committed.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Set the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets. See docs/releasing.md."
            exit 1
          fi
          # dx writes these into Kotlin and TOML strings as they are.
          for value in "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            case "$value" in *[\"\\\$]*)
              echo "::error::The signing passwords and alias cannot hold \", \\ or \$."
              exit 1 ;;
            esac
          done
          mkdir -p target
          echo "$KEYSTORE" | base64 -d > target/release.jks
          cat >> apps/airlock-mobile/Dioxus.toml <<EOF

          [bundle.android]
          # dx resolves this from the workspace root.
          jks_file = "target/release.jks"
          jks_password = "$STORE_PASSWORD"
          key_alias = "$KEY_ALIAS"
          key_password = "$KEY_PASSWORD"
          EOF
      # The runner image has the SDK, an NDK and JDK 17; dx reads these two.
      - name: Bundle the APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          dx bundle -p airlock-mobile --release --android --target aarch64-linux-android --package-types apk
      - name: Collect files
        run: |
          mkdir out
          version="${{ needs.verify.outputs.version }}"
          apk="$(find target/dx/airlock-mobile -path '*outputs/apk/release*' -name 'app-release.apk' | head -n 1 || true)"
          if [ -z "$apk" ]; then
            echo "::error::No signed release APK was produced."
            find target/dx -name '*.apk' 2>/dev/null || true
            exit 1
          fi
          # A debug APK would be debuggable and leave WebView debugging on.
          aapt="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)"
          if "$aapt" dump badging "$apk" | grep -q "application-debuggable"; then
            echo "::error::The APK is debuggable."
            exit 1
          fi
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --print-certs "$apk"
          cp "$apk" "out/airlock-mobile-${version}-android-arm64.apk"
          rm -f target/release.jks
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: out/
          if-no-files-found: error

  macos:
    name: macOS apps and native host
    needs: [verify, checks]
    # Apple Silicon. Intel Macs are not built.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f # v1.26.2
      - name: Install the Dioxus CLI
        run: cargo binstall -y dioxus-cli@${{ env.DX_VERSION }}
      - name: Bundle the apps
        run: |
          scripts/bundle-macos.sh airlock "${{ needs.verify.outputs.version }}" out
          scripts/bundle-macos.sh airlock-offline "${{ needs.verify.outputs.version }}" out
      # A tarball keeps the executable bit, which a browser download drops.
      - name: Build the native messaging host
        run: |
          cargo build --locked --release -p bridge-host
          tar -czf "out/bridge-host-${{ needs.verify.outputs.version }}-macos-arm64.tar.gz" -C target/release bridge-host
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: out/
          if-no-files-found: error

  extension:
    name: Browser extension
    needs: [verify, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension
      - run: npm run build
        working-directory: extension
      - name: Zip
        run: |
          mkdir out
          cd extension/dist
          zip -r "../../out/airlock-extension-${{ needs.verify.outputs.version }}.zip" . -x '*.map'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: out/
          if-no-files-found: error

  publish:
    name: Draft release
    needs: [verify, desktop, airgap, macos, android, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Checksums
        run: |
          mkdir release
          cp artifacts/desktop/* artifacts/airgap/* artifacts/macos/* artifacts/android/* artifacts/extension/* release/
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # Signed statement that these exact files were built by this workflow
      # from this commit. Verify with `gh attestation verify <file> --repo <repo>`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: release/*
      # The same attestation as a Sigstore bundle beside the files, so it can be
      # checked with cosign, without GitHub's CLI or an account.
      - name: Sigstore bundle
        run: cp "${{ steps.attest.outputs.bundle-path }}" "release/airlock-${{ needs.verify.outputs.version }}.sigstore.json"
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Airlock $VERSION" \
            --notes-file artifacts/notes/notes.md \
            --draft $prerelease
