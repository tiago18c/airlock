name: Nightly

# Every day that main has moved, builds every release file from it and puts
# them in one prerelease, tagged nightly, replacing the one before: there is
# only ever one nightly, so they do not pile up. GitHub leaves prereleases out
# of /releases/latest, which the app and the README link to. Run it by hand
# from the Actions tab to build now; from a branch other than main it builds
# without publishing. See docs/releasing.md.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A second run waits: cancelling one mid-publish would leave no nightly.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  decide:
    name: Anything new
    # Forks have the schedule too, but no reason to run it.
    if: github.repository == 'tiago18c/airlock'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || true)"
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "The nightly is already $GITHUB_SHA."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ -z "$base" ]; then
            echo "::error::No version in Cargo.toml's [workspace.package]."
            exit 1
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "version=$base-nightly.$(date -u +%Y%m%d).${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # What has changed since the last release, from the changelog.
      - name: Notes
        if: steps.decide.outputs.build == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          {
            echo "Built from ${GITHUB_SHA} on $(date -u +%Y-%m-%d), by the Nightly workflow. Each nightly replaces the one before."
            echo
            echo "> [!WARNING]"
            echo "> Not a release. Nobody has tried these builds, and they may lose or corrupt what they open. Use them on a test vault, not with funds you cannot lose."
            echo
            # Which file is for whom and how to install each, as on a release.
            sed "s/{{version}}/$VERSION/g" docs/release-notes-header.md
            echo
            echo "## Unreleased"
            awk '/^## \[Unreleased\]/ { on = 1; next } /^## \[/ { on = 0 } on' CHANGELOG.md
          } > notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.decide.outputs.build == 'true'
        with:
          name: notes
          path: notes.md
          retention-days: 3

  build:
    name: Build
    needs: decide
    if: needs.decide.outputs.build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.decide.outputs.version }}
      retention-days: 3
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  publish:
    name: Replace the nightly
    needs: [decide, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Checksums
        run: |
          mkdir release
          cp artifacts/desktop/* artifacts/airgap/* artifacts/macos/* artifacts/linux-*/* artifacts/android/* artifacts/extension/* release/
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # The same provenance as a release: `gh attestation verify <file> --repo <repo>`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: release/*
      - name: Sigstore bundle
        run: cp "${{ steps.attest.outputs.bundle-path }}" "release/airlock-${{ needs.decide.outputs.version }}.sigstore.json"
      - name: Replace the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          # A tag left behind without its release would make create reuse it.
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" 2>/dev/null || true
          gh release create nightly release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Nightly $VERSION" \
            --notes-file artifacts/notes/notes.md \
            --prerelease \
            --latest=false
