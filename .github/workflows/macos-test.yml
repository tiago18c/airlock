name: macOS bundle test

# Throwaway: not merged.
on:
  push:
    branches: [t3/macos-release-test]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DX_VERSION: 0.7.10

jobs:
  macos:
    name: macOS apps and native host
    
    # Apple Silicon. Intel Macs are not built.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f # v1.26.2
      - name: Install the Dioxus CLI
        run: cargo binstall -y dioxus-cli@${{ env.DX_VERSION }}
      - name: Bundle the apps
        run: |
          scripts/bundle-macos.sh airlock "0.1.0" out
          scripts/bundle-macos.sh airlock-offline "0.1.0" out
      # A tarball keeps the executable bit, which a browser download drops.
      - name: Build the native messaging host
        run: |
          cargo build --locked --release -p bridge-host
          tar -czf "out/bridge-host-0.1.0-macos-arm64.tar.gz" -C target/release bridge-host
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: out/
          if-no-files-found: error

