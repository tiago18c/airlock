[package]
name = "codama-dynamic-codecs"
description = "Runtime codec generation from Codama type nodes"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
codama-errors = "0.13.2"
codama-nodes = "0.13.2"
codama-visitors-core = { path = "../codama-visitors-core" }
