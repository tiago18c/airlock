[package]
name = "codama-dynamic-instructions"
description = "Runtime instruction building from Codama nodes"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
codama-errors = "0.13.2"
codama-nodes = "0.13.2"
codama-dynamic-codecs = { path = "../codama-dynamic-codecs" }
codama-dynamic-parsers = { path = "../codama-dynamic-parsers" }
codama-dynamic-resolution = { path = "../codama-dynamic-resolution" }
codama-visitors-core = { path = "../codama-visitors-core" }
indexmap = "2"
serde = { version = "1", features = ["derive"] }
solana-pubkey = { version = "4", default-features = false, features = ["std", "sha2", "curve25519"] }
solana-instruction = { version = "4", default-features = false, features = ["std"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
serde_json = "1"
