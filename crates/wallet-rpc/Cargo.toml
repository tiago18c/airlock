[package]
name = "wallet-rpc"
version.workspace = true
edition.workspace = true
description = "The one Solana RPC client of the app: Agave's client on desktop, the vendored WASM client in a browser"
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
bs58.workspace = true
futures.workspace = true
serde_json.workspace = true
solana-account-decoder-client-types = { version = "4.3", features = ["agave-unstable-api"] }
solana-hash.workspace = true
solana-pubkey.workspace = true
solana-signature.workspace = true
solana-transaction-status-client-types = { version = "4.3", features = ["agave-unstable-api"] }
wallet-core.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
solana-client = "4.3.0"
solana-commitment-config = "3.1"
solana-transaction = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["rt", "macros"] }
wincode.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
solana-client-wasm = { path = "../../vendor/solana-client-wasm" }
wasm-bindgen = "0.2"
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["CloseEvent", "Event", "MessageEvent", "WebSocket"] }

[dev-dependencies]
pollster.workspace = true
solana-message.workspace = true
solana-signature.workspace = true
