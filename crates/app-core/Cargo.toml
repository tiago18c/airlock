[package]
name = "app-core"
version.workspace = true
edition.workspace = true
description = "The app's state, saving, vault and logging, with no UI and no network, for native and web"
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64.workspace = true
bridge-protocol.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
solana-pubkey = { workspace = true, features = ["serde"] }
solana-signature = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2"
wallet-core.workspace = true
wallet-vault.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["sync", "rt", "time"] }
tracing-appender.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers.workspace = true
js-sys.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Window", "Storage", "console"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }
wallet-vault = { workspace = true, features = ["test-hook"] }
