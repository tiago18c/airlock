format = 1
name = "Unstake mSOL now"
summary = "Swaps mSOL for SOL at once through Marinade's liquidity pool, which keeps a fee of up to a few percent, less when the pool holds plenty of SOL."

[programs]
marinade = "MarBmsSgKXdrN1egZf5sqe1TMai9K1rChYNDJgjq7aD"
system = "11111111111111111111111111111111"
token = "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA"

[[input]]
name = "amount"
label = "Amount of mSOL"
hint = "Taken from this wallet's mSOL account."

[[input]]
name = "to"
label = "SOL to"
default = "$wallet"

[values]
msol_account = "associated-token-account $wallet mSoLzYCxHdYgdzU16g5QSh3i5K3z3KZK7ytfqcJm7So $token"
msol_units = "base-units $amount 9"

[[block]]
program = "$marinade"
instruction = "liquidUnstake"
accounts = { getMsolFrom = "$msol_account", getMsolFromAuthority = "$wallet", liqPoolMsolLeg = "7GgPYjS5Dza89wV6FpZ23kUJRG5vbQ1GM25ezspYFSoE", liqPoolSolLegPda = "UefNb6z6yvArqe4cJHTXCqStRsKmWhGxnZzuHbikP5Q", msolMint = "mSoLzYCxHdYgdzU16g5QSh3i5K3z3KZK7ytfqcJm7So", state = "8szGkuLTAux9XMgZ2vtY39jVSowEcpBfFfD8hXSEqdGC", systemProgram = "$system", tokenProgram = "$token", transferSolTo = "$to", treasuryMsolAccount = "B1aLzaNMeFVAyQ6f3XbbUyKcH2YPHu2fqiEagmiF23VR" }
arguments = { msolAmount = "$msol_units" }
