format = 1
name = "Create a token"
summary = "A new mint on the Token program."

[programs]
associated_token = "ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL"
system = "11111111111111111111111111111111"
token = "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA"
token_metadata = "metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s"

[[option]]
name = "metadata"
label = "Name and symbol"
hint = "Stores a name, a symbol and a link to more details with Metaplex Token Metadata, where wallets and explorers look for them. The mint authority signs this transaction too, and can change them later with a tool that writes Token Metadata's update instruction. Build cannot write it yet."

[[option]]
name = "first_supply"
label = "Mint a first supply"
hint = "Mints tokens right away. The mint authority signs this transaction too."

[[input]]
name = "decimals"
label = "Decimals"
hint = "How many decimal places an amount of this token has."
default = "9"

[[input]]
name = "authority"
label = "Mint authority"
hint = "Can mint more of this token."
default = "$wallet"

[[input]]
name = "freeze_authority"
label = "Freeze authority"
hint = "Can freeze accounts that hold this token. Leave blank for none."
optional = true

[[input]]
name = "token_name"
label = "Name"
option = "metadata"

[[input]]
name = "symbol"
label = "Symbol"
option = "metadata"

[[input]]
name = "uri"
label = "Details link"
hint = "A link to a JSON file with the token's image and description."
option = "metadata"

[[input]]
name = "to"
label = "To"
hint = "Receives the first supply in its token account, which is created if missing."
default = "$wallet"
option = "first_supply"

[[input]]
name = "amount"
label = "Amount"
option = "first_supply"

[values]
account = "associated-token-account $to $mint $token"
lamports = "rent-for 82"
metadata_account = "metadata-of $mint"
mint = "new-keypair"

[[block]]
program = "$system"
instruction = "createAccount"
accounts = { newAccount = "$mint", payer = "$fee-payer" }
arguments = { lamports = "$lamports", programAddress = "$token", space = "82" }

[[block]]
program = "$token"
instruction = "initializeMint2"
accounts = { mint = "$mint" }
arguments = { decimals = "$decimals", freezeAuthority = "$freeze_authority", mintAuthority = "$authority" }

[[block]]
when = "metadata"
program = "$token_metadata"
instruction = "createV1"
accounts = { authority = "$authority", metadata = "$metadata_account", mint = "$mint", payer = "$fee-payer", systemProgram = "$system", sysvarInstructions = "Sysvar1nstructions1111111111111111111111111", updateAuthority = "$authority" }
arguments = { "assetData.isMutable" = "true", "assetData.name" = "$token_name", "assetData.primarySaleHappened" = "false", "assetData.sellerFeeBasisPoints" = "0", "assetData.symbol" = "$symbol", "assetData.tokenStandard" = "fungible", "assetData.uri" = "$uri" }

[[block]]
when = "first_supply"
program = "$associated_token"
instruction = "createAssociatedTokenIdempotent"
accounts = { mint = "$mint", owner = "$to", payer = "$fee-payer" }

[[block]]
when = "first_supply"
program = "$token"
instruction = "mintToChecked"
accounts = { mint = "$mint", mintAuthority = "$authority", token = "$account" }
arguments = { amount = "$amount", decimals = "$decimals" }
