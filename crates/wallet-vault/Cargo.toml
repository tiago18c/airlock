[package]
name = "wallet-vault"
version.workspace = true
edition.workspace = true
description = "A password-encrypted vault, the stores it is kept in, and secrets that are wiped from memory"
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = { version = "0.5", features = ["zeroize"] }
base64.workspace = true
chacha20poly1305 = "0.10"
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize = { workspace = true, features = ["zeroize_derive"] }

[features]
# Lets a test see that a lock wiped the key, and seals vaults under a cheap key so
# tests can make many. Not for the app: a release build with it does not compile.
test-hook = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom.workspace = true

[dev-dependencies]
tempfile.workspace = true
