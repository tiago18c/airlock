[package]
name = "hw-transport"
version.workspace = true
edition.workspace = true
description = "The only crate that opens a hardware wallet: HID for Ledger and USB for Trezor on desktop, and a scripted fake"
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hw-protocol.workspace = true
nusb = "0.2.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-hid = "0.5.3"
futures-lite = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "Navigator",
    "Window",
    "Hid",
    "HidCollectionInfo",
    "HidDevice",
    "HidDeviceFilter",
    "HidDeviceRequestOptions",
    "HidInputReportEvent",
] }

[features]
# A scripted device for tests and screenshots. Release builds never turn it on.
fake = []

[dev-dependencies]
futures-lite = "2"
