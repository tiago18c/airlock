[package]
name = "hw-transport"
version.workspace = true
edition.workspace = true
description = "The only crate that opens a hardware wallet: HID for Ledger and USB for Trezor on desktop, and a scripted fake"
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hw-protocol.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-hid = "0.5.3"
futures-lite = "2"
nusb = "0.2.9"

[features]
# A scripted device for tests and screenshots. Release builds never turn it on.
fake = []

[dev-dependencies]
futures-lite = "2"
