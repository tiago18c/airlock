[package]
name = "hw-transport"
version.workspace = true
edition.workspace = true
description = "The only crate that opens a hardware wallet: HID for Ledger and USB for Trezor on desktop, both over USB on Android, and a scripted fake"
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hw-protocol.workspace = true
nusb = "0.2.9"

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
# Not on Android: it has no HID backend there, and Android hands devices over
# as USB file descriptors (`android.rs`).
async-hid = "0.5.3"
futures-lite = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# On desktop nusb's listing and opening are blocking calls, run on tokio's
# blocking threads: without a runtime feature, awaiting them panics.
nusb = { version = "0.2.9", features = ["tokio"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "Navigator",
    "Window",
    "Hid",
    "HidCollectionInfo",
    "HidDevice",
    "HidDeviceFilter",
    "HidDeviceRequestOptions",
    "HidInputReportEvent",
] }

[features]
# A scripted device for tests and screenshots. Release builds never turn it on.
fake = []

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
